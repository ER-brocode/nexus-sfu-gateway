name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true
          cache: true

      - name: Verify Module Dependencies
        run: |
          go mod download
          go mod verify

      - name: Run Go Vet & Linter
        run: |
          go vet ./...

      - name: Run Test Suite
        run: |
          go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Build SFU Gateway Binary
        run: |
          go build -v -o bin/nexus-sfu ./cmd/server/main.go
